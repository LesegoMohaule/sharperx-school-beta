<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
        :root {
            /* The Android app is intentionally light. Do not let a device-level
               dark preference turn the editor ink white on its light surface. */
            color-scheme: light;
            --ink: #000000;
            --muted: #64748b;
            --placeholder: #94a3b8;
            --placeholder-fill: rgba(148, 163, 184, .12);
            --caret: #00aee6;
            --selection: rgba(0, 174, 230, .14);
            --math-font-size: 32px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            color: var(--ink);
            font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        #editor-shell {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 56px;
            max-height: 100%;
            overflow: hidden;
        }

        #line-labels {
            display: none;
            position: absolute;
            inset: 0 auto 0 0;
            z-index: 3;
            width: 62px;
            overflow: hidden;
            border-right: 1px solid rgba(100, 116, 139, .28);
            background: var(--placeholder-fill);
            color: var(--muted);
            font-family: system-ui, sans-serif;
            font-size: 11px;
            font-weight: 600;
            pointer-events: none;
            user-select: none;
        }

        #editor-shell.line-labels-visible #line-labels { display: block; }

        .line-label {
            position: absolute;
            left: 0;
            width: 61px;
            padding: 2px 6px;
            text-align: right;
            white-space: nowrap;
        }

        #editor-shell.line-labels-visible .editor-surface { padding-left: 72px; }
        #editor-shell.line-labels-visible #placeholder { left: 72px; }

        .editor-surface {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: block;
            width: 100%;
            max-width: 100%;
            height: 100%;
            min-height: 56px;
            max-height: 100%;
            padding: 12px 25px 25px 13px;
            background: #ffffff;
            color: var(--ink);
            cursor: text;
            /* The structured editor renders its own red caret. Leaving the
               browser caret enabled would paint a second caret at the same
               logical position, and Android WebView may add its selection
               handle as well. Keep the platform caret invisible while the
               custom keyboard/command model remains authoritative. */
            caret-color: transparent;
            overflow-x: auto;
            overflow-y: auto;
            overflow-wrap: normal;
            word-break: normal;
            overscroll-behavior: contain;
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .editor-surface::-webkit-scrollbar { width: 0; height: 0; }

        .editor-scrollbar {
            /* Scrolling is handled by the WebView touch bridge. Keep the
               diagnostic tracks out of the learner's visual input surface. */
            display: block;
            position: absolute;
            z-index: 4;
            border-radius: 7px;
            background: rgba(100, 116, 139, .22);
            touch-action: none;
            pointer-events: auto;
        }

        .editor-scrollbar.vertical {
            top: 5px;
            right: 4px;
            bottom: 18px;
            width: 14px;
        }

        .editor-scrollbar.horizontal {
            left: 5px;
            right: 18px;
            bottom: 4px;
            height: 14px;
        }

        .editor-scroll-thumb {
            position: absolute;
            border-radius: 7px;
            background: rgba(14, 95, 174, .78);
            box-shadow: 0 1px 3px rgba(15, 23, 42, .28);
        }

        .editor-scrollbar.vertical .editor-scroll-thumb {
            top: 0;
            left: 1px;
            right: 1px;
            min-height: 30px;
        }

        .editor-scrollbar.horizontal .editor-scroll-thumb {
            top: 1px;
            bottom: 1px;
            left: 0;
            min-width: 30px;
        }

        .editor-scrollbar.disabled .editor-scroll-thumb {
            background: rgba(100, 116, 139, .52);
        }

        #placeholder {
            position: absolute;
            z-index: 2;
            inset: 13px 14px auto 14px;
            color: var(--muted);
            font-family: system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.35;
            pointer-events: none;
        }

        #placeholder.hidden { display: none; }

        .math-document {
            display: flex;
            width: 100%;
            max-width: 100%;
            min-width: 100%;
            min-height: 31px;
            flex-wrap: wrap;
            align-items: center;
            align-content: flex-start;
            gap: 0;
            font-size: var(--math-font-size);
            line-height: 1.15;
            transition: font-size 90ms ease-out;
        }

        .editor-surface.minimum-wrapped .math-document {
            align-items: center;
            align-content: flex-start;
            row-gap: .12em;
        }

        .math-sequence {
            display: inline-flex;
            min-width: .12em;
            min-height: 1.15em;
            align-items: center;
            flex-wrap: nowrap;
            vertical-align: middle;
        }

        .math-document > .math-item {
            max-width: none;
        }

        .math-sequence.math-document {
            /* A visual row wrap is not a logical line break. The model only
               creates a new numbered line for an explicit Enter/Return. */
            flex-wrap: wrap;
        }

        .math-item {
            display: inline-flex;
            flex: 0 0 auto;
            max-width: 100%;
            align-items: center;
            vertical-align: middle;
            border-radius: 4px;
        }

        .math-item.environment-item {
            flex: 1 1 100%;
            width: 100%;
            min-width: 0;
        }

        /* Spreadsheet-cell wrapping: top-level items may move to the next
           row, but a mathematical construct is never split across rows. */
        .math-item > .fraction,
        .math-item > .root-node,
        .math-item > .script-node,
        .math-item > .delimiter-node,
        .math-item > .function-node,
        .math-item > .logarithm-node,
        .math-item > .factorial-node,
        .math-item > .derivative-node,
        .math-item > .limit-node,
        .math-item > .large-operator-node,
        .math-item > .integral-node,
        .math-item > .combination-node,
        .math-item > .environment-node {
            flex: 0 0 auto;
            break-inside: avoid;
        }

        .math-item.line-break-item {
            display: block;
            flex: 0 0 100%;
            width: 100%;
            height: 0;
            min-height: 0;
        }

        .line-break {
            display: block;
            width: 100%;
            height: 0;
        }

        .math-item:active { background: var(--selection); }

        .atom { white-space: pre; }
        .operator {
            align-self: center;
            padding: 0 .16em;
            font-family: "Cambria Math", "STIX Two Math", serif;
            line-height: 1;
            vertical-align: middle;
        }
        .relation {
            align-self: center;
            padding: 0 .22em;
            line-height: 1;
            vertical-align: middle;
        }
        .variable { font-style: italic; }
        .function-name { font-style: normal; margin-right: .08em; }

        .slot-placeholder {
            display: inline-block;
            width: .72em;
            min-width: .72em;
            height: .8em;
            margin: 0 .08em;
            align-self: center;
            border: 1px dashed var(--placeholder);
            border-radius: 2px;
            background: var(--placeholder-fill);
        }

        .math-caret {
            display: inline-block;
            flex: 0 0 2px;
            width: 2px;
            height: 1.08em;
            margin: 0 1px;
            align-self: center;
            background: var(--caret);
            border-radius: 1px;
            animation: blink 1.05s steps(2, start) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            margin: 0 .14em;
            text-align: center;
            vertical-align: middle;
            transform: translateY(.03em);
        }

        .fraction-slot {
            display: flex;
            min-width: 1.15em;
            justify-content: center;
            padding: 0 .14em;
            font-size: .82em;
            line-height: 1.05;
        }

        .fraction-numerator {
            padding-bottom: .08em;
            border-bottom: 1.6px solid currentColor;
        }

        .fraction-denominator { padding-top: .08em; }

        .root-node {
            display: inline-flex;
            align-items: flex-start;
            margin: 0 .08em;
            vertical-align: baseline;
        }

        .root-index {
            min-width: .45em;
            margin-right: -.3em;
            transform: translate(.12em, -.1em);
            font-size: .52em;
            line-height: 1;
            z-index: 1;
        }

        .root-symbol {
            font-size: 1.55em;
            line-height: .9;
            transform: translateY(.08em);
        }

        .radicand {
            min-width: .8em;
            padding: .02em .16em .01em .1em;
            border-top: 1.6px solid currentColor;
        }

        .script-node {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }

        .script-base-placeholder {
            width: .72em;
            height: .8em;
            align-self: center;
            border: 1px dashed var(--placeholder);
            border-radius: 2px;
            background: var(--placeholder-fill);
        }

        .script-stack {
            display: inline-flex;
            min-width: .48em;
            flex-direction: column;
            justify-content: center;
            margin-left: .03em;
            font-size: .62em;
            line-height: 1;
            vertical-align: baseline;
        }

        .superscript { transform: translateY(-.38em); }
        .subscript { transform: translateY(.16em); }

        .delimiter-node { display: inline-flex; align-items: center; }
        .delimiter {
            align-self: stretch;
            display: inline-flex;
            align-items: center;
            font-size: 1.08em;
            line-height: 1;
        }

        .function-node { display: inline-flex; align-items: center; }

        .logarithm-node { display: inline-flex; align-items: center; }
        .logarithm-base {
            align-self: flex-end;
            margin: 0 .05em .08em .01em;
            font-size: .55em;
            line-height: 1;
        }

        .factorial-node { display: inline-flex; align-items: center; }

        .derivative-node {
            display: inline-flex;
            align-items: center;
            margin: 0 .12em;
        }

        .derivative-variable { min-width: .55em; }

        .limit-node,
        .large-operator-node,
        .integral-node {
            display: inline-flex;
            align-items: center;
            margin: 0 .12em;
        }

        .limit-symbol { font-style: normal; }
        .limit-target {
            display: inline-flex;
            align-self: flex-end;
            align-items: baseline;
            margin-left: -.15em;
            font-size: .55em;
            transform: translateY(.35em);
        }
        .limit-direction { align-self: flex-start; font-size: .72em; transform: translateY(-.3em); }

        .large-symbol { font-size: 1.55em; line-height: .9; }
        .operator-with-bounds {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: .9;
        }
        .operator-with-bounds > .upper-bound,
        .operator-with-bounds > .lower-bound {
            min-height: .72em;
            font-size: .48em;
            line-height: .85;
        }
        .large-stack {
            display: inline-flex;
            flex-direction: column;
            font-size: .48em;
            line-height: .9;
            align-items: center;
            margin-left: -.22em;
        }

        .integral-symbol { font-size: 1.75em; line-height: .9; }
        .integral-body { margin: 0 .12em; }
        .differential { margin-left: .08em; font-size: .9em; }

        .combination-node { display: inline-flex; align-items: center; }
        .binomial-node {
            display: inline-grid;
            grid-template-columns: auto auto auto;
            align-items: center;
            column-gap: .08em;
        }
        .binomial-values {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: .72em;
            line-height: 1;
        }
        .environment-node {
            display: inline-flex;
            align-items: stretch;
            width: 100%;
            min-width: 0;
            max-width: 100%;
        }
        .environment-node > .math-sequence {
            display: inline-flex;
            width: 100%;
            min-width: 0;
            flex-wrap: wrap;
            align-content: center;
        }
        .cases-brace {
            display: inline-flex;
            align-items: center;
            font-size: 2.15em;
            line-height: 1;
            margin-right: .1em;
        }

        .line-break {
            flex-basis: 100%;
            width: 0;
            height: .25em;
        }

        #measurement-host {
            position: fixed;
            left: -100000px;
            top: -100000px;
            width: max-content;
            height: auto;
            visibility: hidden;
            pointer-events: none;
            contain: layout style paint;
        }

        #measurement-host .math-document {
            width: max-content;
            min-width: 0;
            flex-wrap: nowrap;
            font-size: 32px;
            transition: none;
        }
    </style>
</head>
<body>
    <div id="editor-shell">
        <div id="line-labels" aria-hidden="true"></div>
        <div id="placeholder"></div>
        <div id="editor" class="editor-surface"
             role="textbox"
             aria-multiline="true"
             aria-label="Structured mathematics editor"
             contenteditable="true"
             inputmode="none"
             autocomplete="off"
             autocorrect="off"
             autocapitalize="off"
             spellcheck="false"></div>
        <div id="vertical-scrollbar" class="editor-scrollbar vertical" aria-hidden="true">
            <div id="vertical-scroll-thumb" class="editor-scroll-thumb"></div>
        </div>
        <div id="horizontal-scrollbar" class="editor-scrollbar horizontal" aria-hidden="true">
            <div id="horizontal-scroll-thumb" class="editor-scroll-thumb"></div>
        </div>
    </div>
    <div id="measurement-host" aria-hidden="true"></div>

    <script>
        (() => {
            'use strict';

            const editorShell = document.getElementById('editor-shell');
            const editor = document.getElementById('editor');
            const lineLabels = document.getElementById('line-labels');
            const placeholder = document.getElementById('placeholder');
            const verticalScrollbar = document.getElementById('vertical-scrollbar');
            const verticalScrollThumb = document.getElementById('vertical-scroll-thumb');
            const horizontalScrollbar = document.getElementById('horizontal-scrollbar');
            const horizontalScrollThumb = document.getElementById('horizontal-scroll-thumb');
            const measurementHost = document.getElementById('measurement-host');
            // This is a custom mathematics editor. Android must not open the
            // Samsung/Gboard IME when the contenteditable receives focus;
            // Windows still accepts physical keys through the explicit host
            // bridge below.
            editor.setAttribute('inputmode', 'none');
            editor.setAttribute('autocomplete', 'off');
            editor.setAttribute('autocorrect', 'off');
            editor.setAttribute('autocapitalize', 'off');
            editor.setAttribute('spellcheck', 'false');
            // Clipboard actions are provided by the native app keyboard after
            // a long press. Prevent Chromium's Android context menu from
            // opening a competing Select/Copy/Paste toolbar.
            editor.addEventListener('contextmenu', showClipboardMenu);
            let preferredMathFontSize = 32;
            let minimumMathFontSize = 18;
            let fitMetrics = {
                fontSize: preferredMathFontSize,
                preferredFontSize: preferredMathFontSize,
                minimumFontSize: minimumMathFontSize,
                naturalWidth: 0,
                availableWidth: 0,
                overflow: false,
                wrapped: false
            };
            let nextId = 1;
            let documentModel = createDocument();
            let caret = { sequenceId: documentModel.root.id, offset: 0 };
            let undoStack = [];
            let redoStack = [];
            let placeholderText = 'Enter your answer or show your next step…';
            let renderingMeasurement = false;
            let resizeFrame = 0;
            let activeCommandSequence = 0;
            let selectAllActive = false;
            let scrollbarDrag = null;
            let editorTouchDrag = null;
            let pointerGesture = null;
            let lastCaretPlacementAt = 0;
            let caretPlacementRevision = 0;
            let pendingPhysicalTapCaret = null;
            // Enabled explicitly by the Windows host. Android remains on its
            // existing touch/custom-keyboard path and never consumes hardware
            // key events through this bridge.
            let physicalKeyboardEnabled = false;
            let showLineLabels = false;

            function clearPlatformSelection() {
                // Android's contenteditable selection handle is a second
                // cursor for this editor. The app has semantic selection and
                // clipboard commands, so the custom-keyboard path does not
                // need Chromium's visual selection range. Desktop retains
                // ordinary mouse selection once the Windows host enables its
                // physical-key path.
                if (physicalKeyboardEnabled) return;
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0)
                    selection.removeAllRanges();
            }

            function updateLineLabels() {
                lineLabels.replaceChildren();
                if (!showLineLabels) return;

                const documentElement = editor.querySelector('.math-document');
                if (!documentElement) return;

                const editorBounds = editor.getBoundingClientRect();
                const starts = [documentElement.getBoundingClientRect().top - editorBounds.top + editor.scrollTop];
                const breaks = Array.from(documentElement.children)
                    .filter(item => item.classList.contains('line-break-item'));

                for (const lineBreak of breaks) {
                    // Keep consecutive Enter presses on their own rows. Skipping
                    // blank line-break items made every following gutter label
                    // point at the same next text node, stacking Line 2, Line 3,
                    // etc. on top of each other.
                    const next = lineBreak.nextElementSibling;
                    const nextTop = next
                        ? next.getBoundingClientRect().top - editorBounds.top + editor.scrollTop
                        : lineBreak.getBoundingClientRect().top - editorBounds.top + editor.scrollTop + Math.max(24, fitMetrics.fontSize * 1.2);
                    starts.push(nextTop);
                }

                starts.forEach((contentTop, index) => {
                    const label = element('div', 'line-label', `Line ${index + 1}`);
                    label.style.top = `${Math.max(4, contentTop - editor.scrollTop)}px`;
                    lineLabels.appendChild(label);
                });
            }
            let caretHitDebug = 'none';
            let lastCommandDebug = 'none';
            let lastStateEventDebug = 'none';

            function clamp(value, minimum, maximum) {
                return Math.max(minimum, Math.min(maximum, value));
            }

            function setFontSize(value) {
                const requested = Number.parseFloat(value);
                if (!Number.isFinite(requested)) return;
                preferredMathFontSize = clamp(requested, 8, 72);
                minimumMathFontSize = clamp(preferredMathFontSize * 0.72, 8, preferredMathFontSize);
                document.documentElement.style.setProperty('--math-font-size', `${preferredMathFontSize}px`);
                render();
                emitState('layout');
            }

            function updateScrollbars() {
                if (!editor || !verticalScrollbar || !horizontalScrollbar) return;

                const verticalRange = Math.max(0, editor.scrollHeight - editor.clientHeight);
                const verticalTrackLength = Math.max(1, verticalScrollbar.clientHeight);
                const verticalThumbLength = clamp(
                    verticalTrackLength * (editor.clientHeight / Math.max(editor.scrollHeight, 1)),
                    30,
                    verticalTrackLength);
                const verticalThumbRange = Math.max(0, verticalTrackLength - verticalThumbLength);
                const verticalPosition = verticalRange > 0
                    ? (editor.scrollTop / verticalRange) * verticalThumbRange
                    : 0;
                verticalScrollThumb.style.height = `${verticalThumbLength}px`;
                verticalScrollThumb.style.transform = `translateY(${clamp(verticalPosition, 0, verticalThumbRange)}px)`;
                verticalScrollbar.classList.toggle('disabled', verticalRange <= 1);

                const horizontalRange = Math.max(0, editor.scrollWidth - editor.clientWidth);
                const horizontalTrackLength = Math.max(1, horizontalScrollbar.clientWidth);
                const horizontalThumbLength = clamp(
                    horizontalTrackLength * (editor.clientWidth / Math.max(editor.scrollWidth, 1)),
                    30,
                    horizontalTrackLength);
                const horizontalThumbRange = Math.max(0, horizontalTrackLength - horizontalThumbLength);
                const horizontalPosition = horizontalRange > 0
                    ? (editor.scrollLeft / horizontalRange) * horizontalThumbRange
                    : 0;
                horizontalScrollThumb.style.width = `${horizontalThumbLength}px`;
                horizontalScrollThumb.style.transform = `translateX(${clamp(horizontalPosition, 0, horizontalThumbRange)}px)`;
                horizontalScrollbar.classList.toggle('disabled', horizontalRange <= 1);
                updateLineLabels();
            }

            function scrollFromTrack(event, axis, track, thumb) {
                const bounds = track.getBoundingClientRect();
                const trackLength = axis === 'vertical' ? bounds.height : bounds.width;
                const contentLength = axis === 'vertical' ? editor.scrollHeight : editor.scrollWidth;
                const viewportLength = axis === 'vertical' ? editor.clientHeight : editor.clientWidth;
                const thumbLength = axis === 'vertical' ? thumb.offsetHeight : thumb.offsetWidth;
                const range = Math.max(0, contentLength - viewportLength);
                const thumbRange = Math.max(0, trackLength - thumbLength);
                if (range <= 0 || thumbRange <= 0) return;
                const pointerPosition = axis === 'vertical'
                    ? event.clientY - bounds.top
                    : event.clientX - bounds.left;
                const nextPosition = clamp(pointerPosition - (thumbLength / 2), 0, thumbRange);
                if (axis === 'vertical') editor.scrollTop = (nextPosition / thumbRange) * range;
                else editor.scrollLeft = (nextPosition / thumbRange) * range;
                updateScrollbars();
            }

            function bindScrollbar(track, thumb, axis) {
                const beginDrag = (pointerId, pointerPosition) => {
                    scrollbarDrag = {
                        axis,
                        pointerId,
                        startPointer: pointerPosition,
                        startScroll: axis === 'vertical' ? editor.scrollTop : editor.scrollLeft,
                        trackLength: axis === 'vertical' ? track.clientHeight : track.clientWidth,
                        thumbLength: axis === 'vertical' ? thumb.offsetHeight : thumb.offsetWidth
                    };
                };

                const moveDrag = (pointerId, pointerPosition) => {
                    if (!scrollbarDrag || scrollbarDrag.pointerId !== pointerId) return;
                    const contentLength = axis === 'vertical' ? editor.scrollHeight : editor.scrollWidth;
                    const viewportLength = axis === 'vertical' ? editor.clientHeight : editor.clientWidth;
                    const range = Math.max(0, contentLength - viewportLength);
                    const thumbRange = Math.max(1, scrollbarDrag.trackLength - scrollbarDrag.thumbLength);
                    const nextScroll = scrollbarDrag.startScroll +
                        ((pointerPosition - scrollbarDrag.startPointer) / thumbRange) * range;
                    if (axis === 'vertical') editor.scrollTop = clamp(nextScroll, 0, range);
                    else editor.scrollLeft = clamp(nextScroll, 0, range);
                    updateScrollbars();
                };

                const stopDrag = pointerId => {
                    if (scrollbarDrag?.pointerId === pointerId) scrollbarDrag = null;
                };

                thumb.addEventListener('pointerdown', event => {
                    event.preventDefault();
                    event.stopPropagation();
                    beginDrag(event.pointerId, axis === 'vertical' ? event.clientY : event.clientX);
                    thumb.setPointerCapture?.(event.pointerId);
                });

                thumb.addEventListener('pointermove', event => {
                    moveDrag(event.pointerId, axis === 'vertical' ? event.clientY : event.clientX);
                });

                const stopDragging = event => stopDrag(event.pointerId);
                thumb.addEventListener('pointerup', stopDragging);
                thumb.addEventListener('pointercancel', stopDragging);
                thumb.addEventListener('lostpointercapture', stopDragging);

                // Samsung WebView can deliver a finger drag as touch events
                // without a usable pointer capture. Keep the custom tracks
                // draggable on that path as well.
                thumb.addEventListener('touchstart', event => {
                    const touch = event.changedTouches && event.changedTouches[0];
                    if (!touch) return;
                    event.preventDefault();
                    event.stopPropagation();
                    beginDrag(touch.identifier, axis === 'vertical' ? touch.clientY : touch.clientX);
                }, { passive: false });
                thumb.addEventListener('touchmove', event => {
                    const touch = Array.from(event.changedTouches || [])
                        .find(candidate => candidate.identifier === scrollbarDrag?.pointerId);
                    if (!touch) return;
                    event.preventDefault();
                    event.stopPropagation();
                    moveDrag(touch.identifier, axis === 'vertical' ? touch.clientY : touch.clientX);
                }, { passive: false });
                const stopTouchDragging = event => {
                    const touch = Array.from(event.changedTouches || [])
                        .find(candidate => candidate.identifier === scrollbarDrag?.pointerId);
                    if (touch) stopDrag(touch.identifier);
                };
                thumb.addEventListener('touchend', stopTouchDragging, { passive: true });
                thumb.addEventListener('touchcancel', stopTouchDragging, { passive: true });

                track.addEventListener('pointerdown', event => {
                    if (event.target === thumb) return;
                    event.preventDefault();
                    event.stopPropagation();
                    scrollFromTrack(event, axis, track, thumb);
                });
                track.addEventListener('touchstart', event => {
                    if (event.target === thumb) return;
                    const touch = event.changedTouches && event.changedTouches[0];
                    if (!touch) return;
                    event.preventDefault();
                    event.stopPropagation();
                    scrollFromTrack({ clientX: touch.clientX, clientY: touch.clientY }, axis, track, thumb);
                }, { passive: false });
            }

            bindScrollbar(verticalScrollbar, verticalScrollThumb, 'vertical');
            bindScrollbar(horizontalScrollbar, horizontalScrollThumb, 'horizontal');
            editor.addEventListener('scroll', updateScrollbars, { passive: true });

            function sequence(items = [], role = 'expression') {
                return { type: 'sequence', id: `s${nextId++}`, role, items };
            }

            function createDocument() {
                return { type: 'document', root: sequence([], 'document'), sourceLatex: null };
            }

            function atom(value, latex = null) {
                const result = { type: 'atom', value };
                if (latex) result.latex = latex;
                return result;
            }

            function clone(value) {
                return JSON.parse(JSON.stringify(value));
            }

            function element(tag, className, text) {
                const result = document.createElement(tag);
                if (className) result.className = className;
                if (text !== undefined) result.textContent = text;
                return result;
            }

            function nestedSequences(node) {
                switch (node.type) {
                    case 'fraction': return [node.numerator, node.denominator];
                    case 'root': return node.index ? [node.index, node.radicand] : [node.radicand];
                    case 'script': {
                        const result = [node.base];
                        if (node.superscript) result.push(node.superscript);
                        if (node.subscript) result.push(node.subscript);
                        return result;
                    }
                    case 'function': {
                        const result = [];
                        if (node.power) result.push(node.power);
                        result.push(node.argument);
                        return result;
                    }
                    case 'logarithm': {
                        const result = [];
                        if (node.base) result.push(node.base);
                        result.push(node.argument);
                        return result;
                    }
                    case 'factorial': return [node.operand];
                    case 'delimiter': return [node.body];
                    case 'derivative': return [node.numerator, node.variable];
                    case 'limit': {
                        const result = [node.variable, node.destination];
                        if (node.direction) result.push(node.direction);
                        return result;
                    }
                    case 'integral': {
                        const result = [];
                        if (node.lower) result.push(node.lower);
                        if (node.upper) result.push(node.upper);
                        result.push(node.body);
                        return result;
                    }
                    case 'combination': return [node.left, node.right];
                    case 'largeOperator': return [node.lower, node.upper, node.body];
                    case 'environment': return [node.body];
                    default: return [];
                }
            }

            function findSequence(sequenceId, current = documentModel.root) {
                if (current.id === sequenceId) return current;
                for (const item of current.items) {
                    for (const nested of nestedSequences(item)) {
                        const found = findSequence(sequenceId, nested);
                        if (found) return found;
                    }
                }
                return null;
            }

            function findParent(sequenceId, current = documentModel.root) {
                for (let index = 0; index < current.items.length; index++) {
                    const node = current.items[index];
                    const slots = nestedSequences(node);
                    for (let slotIndex = 0; slotIndex < slots.length; slotIndex++) {
                        const slot = slots[slotIndex];
                        if (slot.id === sequenceId) {
                            return { parentSequence: current, node, nodeIndex: index, slot, slotIndex, slots };
                        }
                        const found = findParent(sequenceId, slot);
                        if (found) return found;
                    }
                }
                return null;
            }

            function currentSequence() {
                let result = findSequence(caret.sequenceId);
                if (!result) {
                    result = documentModel.root;
                    caret = { sequenceId: result.id, offset: result.items.length };
                }
                caret.offset = Math.max(0, Math.min(caret.offset, result.items.length));
                return result;
            }

            function sequenceHasVisibleText(model) {
                return (model?.items || []).some(node => {
                    if (node.type === 'atom') return /\S/u.test(String(node.value || ''));
                    if (node.type === 'lineBreak') return false;
                    return nestedSequences(node).some(sequenceHasVisibleText);
                });
            }

            function currentLineHasVisibleText() {
                const { model, start, end } = currentLineRange();
                return sequenceHasVisibleText({ items: model.items.slice(start, end) });
            }

            function currentLineRange() {
                let model = currentSequence();
                let offset = caret.offset;
                // A numerator/exponent is a slot, not a new editor line.
                while (model.id !== documentModel.root.id) {
                    const parent = findParent(model.id);
                    if (!parent) break;
                    offset = parent.nodeIndex;
                    model = parent.parentSequence;
                }
                let start = offset;
                while (start > 0 && model.items[start - 1].type !== 'lineBreak') start--;
                let end = offset;
                while (end < model.items.length && model.items[end].type !== 'lineBreak') end++;
                return { model, start, end };
            }

            function recordHistory() {
                undoStack.push(JSON.stringify({ documentModel, caret }));
                if (undoStack.length > 100) undoStack.shift();
                redoStack = [];
            }

            function restoreSnapshot(serialized) {
                const snapshot = JSON.parse(serialized);
                documentModel = snapshot.documentModel;
                caret = snapshot.caret;
                render();
                emitState('change');
            }

            function isOperator(value) {
                return ['+', '−', '-', '×', '÷', '=', '<', '>', '≤', '≥', '≠', '≈', '±', '/', '%', '→'].includes(value);
            }

            function isRelation(value) {
                return ['=', '<', '>', '≤', '≥', '≠', '≈', '→'].includes(value);
            }

            function renderSequence(model, extraClass = '', showPlaceholder = true) {
                const container = element('span', `math-sequence ${extraClass}`.trim());
                container.dataset.sequenceId = model.id;
                container.dataset.role = model.role || 'expression';

                for (let index = 0; index <= model.items.length; index++) {
                    if (!renderingMeasurement && caret.sequenceId === model.id && caret.offset === index) {
                        const caretElement = element('span', 'math-caret');
                        caretElement.setAttribute('aria-hidden', 'true');
                        container.appendChild(caretElement);
                    }

                    if (index < model.items.length) {
                        const node = model.items[index];
                        const wrapperClass = node.type === 'lineBreak'
                            ? 'math-item line-break-item'
                            : node.type === 'environment'
                                ? 'math-item environment-item'
                                : 'math-item';
                        const wrapper = element('span', wrapperClass);
                        wrapper.dataset.itemIndex = String(index);
                        wrapper.appendChild(renderNode(node));
                        container.appendChild(wrapper);
                    }
                }

                if (model.items.length === 0 && showPlaceholder) {
                    const emptySlot = element('span', 'slot-placeholder');
                    emptySlot.setAttribute('aria-label', `Empty ${model.role || 'maths'} slot`);
                    container.appendChild(emptySlot);
                }

                return container;
            }

            function renderNode(node) {
                switch (node.type) {
                    case 'atom': {
                        const classes = ['atom'];
                        if (isOperator(node.value)) classes.push('operator');
                        if (isRelation(node.value)) classes.push('relation');
                        if (/^[A-Za-z]$/.test(node.value)) classes.push('variable');
                        return element('span', classes.join(' '), node.value);
                    }
                    case 'lineBreak':
                        return element('span', 'line-break');
                    case 'fraction': {
                        const fraction = element('span', 'fraction');
                        fraction.appendChild(renderSequence(node.numerator, 'fraction-slot fraction-numerator'));
                        fraction.appendChild(renderSequence(node.denominator, 'fraction-slot fraction-denominator'));
                        return fraction;
                    }
                    case 'root': {
                        const root = element('span', 'root-node');
                        if (node.index) root.appendChild(renderSequence(node.index, 'root-index'));
                        root.appendChild(element('span', 'root-symbol', '√'));
                        root.appendChild(renderSequence(node.radicand, 'radicand'));
                        return root;
                    }
                    case 'script': {
                        const script = element('span', 'script-node');
                        script.appendChild(renderSequence(node.base, 'script-base'));
                        const stack = element('span', 'script-stack');
                        if (node.superscript) stack.appendChild(renderSequence(node.superscript, 'superscript'));
                        if (node.subscript) stack.appendChild(renderSequence(node.subscript, 'subscript'));
                        script.appendChild(stack);
                        return script;
                    }
                    case 'function': {
                        const fn = element('span', 'function-node');
                        if (node.power) {
                            const poweredName = element('span', 'script-node');
                            poweredName.appendChild(element('span', 'function-name', node.name));
                            const stack = element('span', 'script-stack');
                            stack.appendChild(renderSequence(node.power, 'superscript'));
                            poweredName.appendChild(stack);
                            fn.appendChild(poweredName);
                        } else fn.appendChild(element('span', 'function-name', node.name));
                        fn.appendChild(renderSequence(node.argument, 'function-argument'));
                        return fn;
                    }
                    case 'logarithm': {
                        const logarithm = element('span', 'logarithm-node');
                        logarithm.appendChild(element('span', 'function-name', 'log'));
                        if (node.base) logarithm.appendChild(renderSequence(node.base, 'logarithm-base'));
                        logarithm.appendChild(renderSequence(node.argument, 'function-argument'));
                        return logarithm;
                    }
                    case 'factorial': {
                        const factorial = element('span', 'factorial-node');
                        factorial.appendChild(renderSequence(node.operand, 'factorial-operand'));
                        factorial.appendChild(element('span', 'atom', '!'));
                        return factorial;
                    }
                    case 'delimiter': {
                        const delimiter = element('span', 'delimiter-node');
                        delimiter.appendChild(element('span', 'delimiter', node.open));
                        delimiter.appendChild(renderSequence(node.body, 'delimiter-body'));
                        delimiter.appendChild(element('span', 'delimiter', node.close));
                        return delimiter;
                    }
                    case 'derivative': {
                        const derivative = element('span', 'derivative-node');
                        const fraction = element('span', 'fraction');
                        const numeratorElement = element('span', 'fraction-slot fraction-numerator');
                        numeratorElement.appendChild(element('span', 'atom', node.order === 2 ? 'd²' : 'd'));
                        numeratorElement.appendChild(renderSequence(node.numerator, 'derivative-numerator', false));
                        fraction.appendChild(numeratorElement);
                        const denominatorElement = element('span', 'fraction-slot fraction-denominator');
                        denominatorElement.appendChild(element('span', 'atom', 'd'));
                        denominatorElement.appendChild(renderSequence(node.variable, 'derivative-variable'));
                        if (node.order === 2) denominatorElement.appendChild(element('span', 'atom', '²'));
                        fraction.appendChild(denominatorElement);
                        derivative.appendChild(fraction);
                        return derivative;
                    }
                    case 'limit': {
                        const limit = element('span', 'limit-node');
                        limit.appendChild(element('span', 'limit-symbol', 'lim'));
                        const target = element('span', 'limit-target');
                        target.appendChild(renderSequence(node.variable, 'limit-variable'));
                        target.appendChild(element('span', 'atom operator', '→'));
                        target.appendChild(renderSequence(node.destination, 'limit-destination'));
                        if (node.direction) target.appendChild(renderSequence(node.direction, 'limit-direction'));
                        limit.appendChild(target);
                        return limit;
                    }
                    case 'integral': {
                        const integral = element('span', 'integral-node');
                        if (node.lower || node.upper) {
                            const boundedSymbol = element('span', 'operator-with-bounds');
                            if (node.upper) boundedSymbol.appendChild(renderSequence(node.upper, 'upper-bound'));
                            boundedSymbol.appendChild(element('span', 'integral-symbol', '∫'));
                            if (node.lower) boundedSymbol.appendChild(renderSequence(node.lower, 'lower-bound'));
                            integral.appendChild(boundedSymbol);
                        } else integral.appendChild(element('span', 'integral-symbol', '∫'));
                        integral.appendChild(renderSequence(node.body, 'integral-body'));
                        if (node.differential) integral.appendChild(element('span', 'differential', `d${node.differential}`));
                        return integral;
                    }
                    case 'combination': {
                        if (node.symbol === 'binom') {
                            const binomial = element('span', 'combination-node binomial-node');
                            binomial.appendChild(element('span', 'delimiter', '('));
                            const values = element('span', 'binomial-values');
                            values.appendChild(renderSequence(node.left, 'first argument'));
                            values.appendChild(renderSequence(node.right, 'second argument'));
                            binomial.appendChild(values);
                            binomial.appendChild(element('span', 'delimiter', ')'));
                            return binomial;
                        }
                        const combination = element('span', 'combination-node');
                        combination.appendChild(element('span', 'atom', node.symbol));
                        combination.appendChild(renderSequence(node.left, 'first argument'));
                        combination.appendChild(element('span', 'atom operator', ','));
                        combination.appendChild(renderSequence(node.right, 'second argument'));
                        return combination;
                    }
                    case 'largeOperator': {
                        const large = element('span', 'large-operator-node');
                        const boundedSymbol = element('span', 'operator-with-bounds');
                        boundedSymbol.appendChild(renderSequence(node.upper, 'upper-bound'));
                        boundedSymbol.appendChild(element('span', 'large-symbol', node.operator === 'product' ? 'Π' : 'Σ'));
                        boundedSymbol.appendChild(renderSequence(node.lower, 'lower-bound'));
                        large.appendChild(boundedSymbol);
                        large.appendChild(renderSequence(node.body, 'operator expression'));
                        return large;
                    }
                    case 'environment': {
                        const environment = element('span', `environment-node ${node.name}-environment`);
                        if (node.name === 'cases') environment.appendChild(element('span', 'cases-brace', '{'));
                        environment.appendChild(renderSequence(node.body, `${node.name} rows`));
                        return environment;
                    }
                    default:
                        return element('span', 'atom', '');
                }
            }

            function topLevelLines() {
                const lines = [[]];
                for (const item of documentModel.root.items) {
                    if (item.type === 'lineBreak') lines.push([]);
                    else lines[lines.length - 1].push(item);
                }
                return lines;
            }

            function measureNaturalLineWidth() {
                measurementHost.replaceChildren();
                let maximum = 0;
                renderingMeasurement = true;
                try {
                    const lines = topLevelLines();
                    for (let index = 0; index < lines.length; index++) {
                        const probeModel = {
                            type: 'sequence',
                            id: `measurement-${index}`,
                            role: 'measurement',
                            items: lines[index]
                        };
                        const probe = renderSequence(probeModel, 'math-document', false);
                        probe.style.fontSize = `${preferredMathFontSize}px`;
                        measurementHost.appendChild(probe);
                        maximum = Math.max(maximum, probe.getBoundingClientRect().width);
                    }
                } finally {
                    renderingMeasurement = false;
                    measurementHost.replaceChildren();
                }
                return maximum;
            }

            function applyAutoFit(documentElement) {
                const computed = getComputedStyle(editor);
                const horizontalPadding = parseFloat(computed.paddingLeft || '0') + parseFloat(computed.paddingRight || '0');
                const measuredEditorWidth = editor.clientWidth || editor.getBoundingClientRect().width || 0;
                const availableWidth = Math.max(0, measuredEditorWidth - horizontalPadding);
                const naturalWidth = measureNaturalLineWidth();
                const hasExplicitBreak = Boolean(documentElement.querySelector('.line-break-item'));
                const proportionalSize = naturalWidth > 0 && availableWidth > 0
                    ? preferredMathFontSize * availableWidth / naturalWidth
                    : preferredMathFontSize;
                const fontSize = Math.max(
                    minimumMathFontSize,
                    Math.min(preferredMathFontSize, proportionalSize));
                const fittedWidth = naturalWidth * fontSize / preferredMathFontSize;
                const requiresVisualWrap = availableWidth > 0 && fittedWidth > availableWidth + 1;
                const wrapped = hasExplicitBreak || requiresVisualWrap;

                documentElement.style.fontSize = `${fontSize}px`;
                documentElement.style.width = '100%';
                documentElement.style.minWidth = '100%';
                documentElement.style.maxWidth = '100%';
                documentElement.style.flexWrap = 'wrap';
                editor.classList.toggle('minimum-wrapped', requiresVisualWrap);

                // A wrapped logical line should not expose horizontal
                // overflow. Keep this metric for genuinely indivisible math
                // structures that are wider than the editor viewport.
                const overflow = editor.scrollWidth > editor.clientWidth + 1;

                fitMetrics = {
                    fontSize,
                    preferredFontSize: preferredMathFontSize,
                    minimumFontSize: minimumMathFontSize,
                    naturalWidth: Math.round(naturalWidth * 10) / 10,
                    availableWidth: Math.round(availableWidth * 10) / 10,
                    overflow,
                    wrapped
                };
            }

            function scheduleInitialFitRetry() {
                requestAnimationFrame(() => {
                    const documentElement = editor.querySelector('.math-document');
                    if (!documentElement) return;
                    const before = JSON.stringify(fitMetrics);
                    applyAutoFit(documentElement);
                    const after = JSON.stringify(fitMetrics);
                    if (before !== after) {
                        const caretElement = editor.querySelector('.math-caret');
                        if (caretElement) caretElement.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                        emitState('layout');
                    }
                });
            }

            function render() {
                editor.replaceChildren();
                const documentElement = renderSequence(documentModel.root, 'math-document');
                editor.appendChild(documentElement);
                applyAutoFit(documentElement);
                scheduleInitialFitRetry();
                placeholder.textContent = placeholderText;
                placeholder.classList.toggle('hidden', hasMeaningfulContent(documentModel.root) || documentModel.root.items.length > 0);
                editor.setAttribute('aria-label', `${describeDocument()} ${describeFitMetrics()}`);

                requestAnimationFrame(() => {
                    const caretElement = editor.querySelector('.math-caret');
                    if (caretElement) caretElement.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                    updateScrollbars();
                    updateLineLabels();
                });
            }

            function refitAfterResize() {
                if (resizeFrame) cancelAnimationFrame(resizeFrame);
                resizeFrame = requestAnimationFrame(() => {
                    resizeFrame = 0;
                    const documentElement = editor.querySelector('.math-document');
                    if (!documentElement) return;
                    const previousSize = fitMetrics.fontSize;
                    const previousWidth = fitMetrics.availableWidth;
                    applyAutoFit(documentElement);
                    const caretElement = editor.querySelector('.math-caret');
                    if (caretElement) caretElement.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                    updateScrollbars();
                    if (Math.abs(previousSize - fitMetrics.fontSize) >= .5 ||
                        Math.abs(previousWidth - fitMetrics.availableWidth) >= 1) {
                        emitState('layout');
                    }
                });
            }

            function allCaretPositions() {
                const positions = [];
                function visit(model) {
                    positions.push({ sequenceId: model.id, offset: 0 });
                    for (let index = 0; index < model.items.length; index++) {
                        for (const nested of nestedSequences(model.items[index])) visit(nested);
                        positions.push({ sequenceId: model.id, offset: index + 1 });
                    }
                }
                visit(documentModel.root);
                return positions;
            }

            function currentPositionIndex(positions) {
                return positions.findIndex(position =>
                    position.sequenceId === caret.sequenceId && position.offset === caret.offset);
            }

            function moveHorizontal(direction) {
                selectAllActive = false;
                const model = currentSequence();
                const parent = findParent(model.id);
                if (parent && direction > 0 && caret.offset >= model.items.length) {
                    const nextSlot = parent.slots[parent.slotIndex + 1];
                    caret = nextSlot
                        ? { sequenceId: nextSlot.id, offset: 0 }
                        : { sequenceId: parent.parentSequence.id, offset: parent.nodeIndex + 1 };
                    render();
                    emitState('caret');
                    return;
                }
                if (parent && direction < 0 && caret.offset <= 0) {
                    const previousSlot = parent.slots[parent.slotIndex - 1];
                    caret = previousSlot
                        ? { sequenceId: previousSlot.id, offset: previousSlot.items.length }
                        : { sequenceId: parent.parentSequence.id, offset: parent.nodeIndex };
                    render();
                    emitState('caret');
                    return;
                }

                const positions = allCaretPositions();
                const index = currentPositionIndex(positions);
                if (index < 0) return;
                const target = positions[Math.max(0, Math.min(positions.length - 1, index + direction))];
                caret = { ...target };
                render();
                emitState('caret');
            }

            function moveVertical(direction) {
                selectAllActive = false;
                const parent = findParent(caret.sequenceId);
                if (!parent) return;

                let target = null;
                if (parent.node.type === 'fraction') {
                    target = direction < 0 ? parent.node.numerator : parent.node.denominator;
                } else if (parent.node.type === 'script') {
                    target = direction < 0 ? parent.node.superscript : parent.node.subscript;
                } else if (parent.node.type === 'root') {
                    target = direction < 0 ? parent.node.index : parent.node.radicand;
                } else if (parent.node.type === 'logarithm') {
                    target = direction < 0 ? parent.node.base : parent.node.argument;
                } else if (parent.node.type === 'derivative') {
                    target = direction < 0 ? parent.node.numerator : parent.node.variable;
                } else if (parent.node.type === 'integral' || parent.node.type === 'largeOperator') {
                    target = direction < 0 ? parent.node.upper : parent.node.lower;
                }

                if (!target || target.id === caret.sequenceId) return;
                caret = { sequenceId: target.id, offset: Math.min(caret.offset, target.items.length) };
                render();
                emitState('caret');
            }

            function setCaret(sequenceId, offset, eventName = 'caret') {
                const model = findSequence(sequenceId);
                if (!model) return;
                selectAllActive = false;
                caret = { sequenceId, offset: Math.max(0, Math.min(offset, model.items.length)) };
                render();
                emitState(eventName);
            }

            function insertNode(node, targetSequence, targetOffset) {
                const model = targetSequence || currentSequence();
                const offset = targetOffset === undefined ? caret.offset : targetOffset;
                model.items.splice(offset, 0, node);
                caret = { sequenceId: model.id, offset: offset + 1 };
            }

            function appendTextWithoutHistory(value) {
                for (const character of Array.from(value || '')) {
                    if (character === '\r') continue;
                    if (character === '\n') {
                        if (!currentLineHasVisibleText()) continue;
                        // Enter exits a fraction/script onto the next logical
                        // line; it must never insert a line break inside a slot.
                        while (caret.sequenceId !== documentModel.root.id) {
                            const parent = findParent(caret.sequenceId);
                            if (!parent) break;
                            caret = { sequenceId: parent.parentSequence.id, offset: parent.nodeIndex + 1 };
                        }
                        insertNode({ type: 'lineBreak' });
                        continue;
                    }

                    if ([')', ']', '}'].includes(character) && tryExitDelimiter(character)) continue;
                    // A parenthesised exponent is commonly entered as
                    // `base`, power, `(`, expression, `)`, then the rest of
                    // the function. The lightweight keyboard inserts the
                    // parentheses as literal atoms, so the closing bracket
                    // must also leave the exponent slot; otherwise the next
                    // term is silently captured inside the exponent (for
                    // example 2^(x-3)+2 becoming 2^((x-3)+2)).
                    if (character === ')' && tryExitPowerAfterClosingParenthesis()) continue;
                    insertNode(atom(character === '-' ? '−' : character));
                }
            }

            function tryExitDelimiter(closing) {
                const model = currentSequence();
                const parent = findParent(model.id);
                if (!parent || parent.node.type !== 'delimiter' || parent.node.close !== closing || caret.offset !== model.items.length) {
                    return false;
                }
                caret = { sequenceId: parent.parentSequence.id, offset: parent.nodeIndex + 1 };
                return true;
            }

            function tryExitPowerAfterClosingParenthesis() {
                const model = currentSequence();
                if (model.role !== 'exponent' || caret.offset !== model.items.length)
                    return false;

                // Only treat a final unmatched literal '(' as the grouping
                // opened in this exponent. Nested literal parentheses remain
                // ordinary text until their own closing parenthesis arrives.
                let depth = 0;
                for (const item of model.items) {
                    if (item.type !== 'atom') continue;
                    if (item.value === '(') depth++;
                    else if (item.value === ')' && depth > 0) depth--;
                }
                if (depth <= 0) return false;

                const parent = findParent(model.id);
                if (!parent || parent.node.type !== 'script' || parent.node.superscript !== model)
                    return false;

                insertNode(atom(')'), model, caret.offset);
                caret = { sequenceId: parent.parentSequence.id, offset: parent.nodeIndex + 1 };
                return true;
            }

            function insertText(value) {
                if (!value) return;
                if (/^[\r\n]+$/.test(value) && !currentLineHasVisibleText()) return;
                recordHistory();
                deleteSelectionWithoutHistory();
                appendTextWithoutHistory(value);
                finishChange();
            }

            function insertFraction() {
                recordHistory();
                const node = {
                    type: 'fraction',
                    numerator: sequence([], 'numerator'),
                    denominator: sequence([], 'denominator')
                };
                insertNode(node);
                caret = { sequenceId: node.numerator.id, offset: 0 };
                finishChange();
            }

            function insertRoot(withIndex) {
                recordHistory();
                const node = {
                    type: 'root',
                    index: withIndex ? sequence([], 'root index') : null,
                    radicand: sequence([], 'radicand')
                };
                insertNode(node);
                caret = { sequenceId: withIndex ? node.index.id : node.radicand.id, offset: 0 };
                finishChange();
            }

            function isExpressionBoundary(node) {
                return node.type === 'lineBreak' ||
                    (node.type === 'atom' && isRelation(node.value));
            }

            function takeTrailingExpression(model, role = 'base') {
                const end = caret.offset;
                let start = end;
                while (start > 0 && !isExpressionBoundary(model.items[start - 1])) start--;
                while (start < end && model.items[start].type === 'atom' && /^\s+$/.test(model.items[start].value)) start++;
                if (start >= end) return sequence([], role);

                const selected = model.items.splice(start, end - start);
                caret.offset = start;
                // Fixed-power and subscript keys must never manufacture
                // parentheses around the expression. Only an explicit
                // bracket key creates a delimiter/atom; keeping the selected
                // sequence intact preserves the textbook caret/slot model.
                return sequence(selected, role);
            }

            function insertPower(fixedExponent) {
                recordHistory();
                const model = currentSequence();
                const base = takeTrailingExpression(model);
                const exponent = sequence([], 'exponent');
                if (fixedExponent !== undefined && fixedExponent !== null) {
                    exponent.items.push(atom(String(fixedExponent)));
                }
                const node = { type: 'script', base, superscript: exponent, subscript: null };
                insertNode(node, model, caret.offset);
                if (fixedExponent === undefined || fixedExponent === null) {
                    caret = { sequenceId: exponent.id, offset: 0 };
                } else if (base.items.length === 0) {
                    caret = { sequenceId: base.id, offset: 0 };
                }
                finishChange();
            }

            function insertSubscript() {
                recordHistory();
                const model = currentSequence();
                const base = takeTrailingExpression(model);
                const subscript = sequence([], 'subscript');
                const node = { type: 'script', base, superscript: null, subscript };
                insertNode(node, model, caret.offset);
                caret = { sequenceId: subscript.id, offset: 0 };
                finishChange();
            }

            function insertDelimiter(kind) {
                const pairs = { '()': ['(', ')'], '[]': ['[', ']'], '{}': ['{', '}'], '||': ['|', '|'] };
                const pair = pairs[kind] || ['(', ')'];
                recordHistory();
                const node = { type: 'delimiter', open: pair[0], close: pair[1], body: sequence([], 'delimited expression') };
                insertNode(node);
                caret = { sequenceId: node.body.id, offset: 0 };
                finishChange();
            }

            function insertFunction(name) {
                recordHistory();
                const safeName = String(name || 'sin').replace(/[^A-Za-z]/g, '') || 'sin';
                const node = { type: 'function', name: safeName, argument: sequence([], `${safeName} argument`) };
                insertNode(node);
                caret = { sequenceId: node.argument.id, offset: 0 };
                finishChange();
            }

            function insertLogarithm() {
                recordHistory();
                const node = {
                    type: 'logarithm',
                    base: sequence([], 'logarithm base'),
                    argument: sequence([], 'logarithm argument')
                };
                insertNode(node);
                caret = { sequenceId: node.base.id, offset: 0 };
                finishChange();
            }

            function insertFactorial() {
                recordHistory();
                const model = currentSequence();
                const operand = takeTrailingExpression(model, 'factorial operand');
                const node = { type: 'factorial', operand };
                insertNode(node, model, caret.offset);
                if (operand.items.length === 0) caret = { sequenceId: operand.id, offset: 0 };
                finishChange();
            }

            function insertInfinity() {
                recordHistory();
                insertNode(atom('∞'));
                finishChange();
            }

            function insertDerivative(order) {
                recordHistory();
                const node = {
                    type: 'derivative',
                    order: Number(order) === 2 ? 2 : 1,
                    numerator: sequence([], 'derivative numerator'),
                    variable: sequence([], 'differentiation variable')
                };
                insertNode(node);
                caret = { sequenceId: node.variable.id, offset: 0 };
                finishChange();
            }

            function insertLimit(kind) {
                recordHistory();
                const node = {
                    type: 'limit',
                    variable: sequence([], 'limit variable'),
                    destination: sequence([], 'limit destination'),
                    direction: kind === 'right'
                        ? sequence([atom('+')], 'limit direction')
                        : kind === 'left'
                            ? sequence([atom('−')], 'limit direction')
                            : null
                };
                insertNode(node);
                caret = { sequenceId: node.variable.id, offset: 0 };
                finishChange();
            }

            function insertIntegral(kind) {
                recordHistory();
                const definite = kind === 'definite';
                const node = {
                    type: 'integral',
                    lower: definite ? sequence([], 'lower bound') : null,
                    upper: definite ? sequence([], 'upper bound') : null,
                    body: sequence([], 'integrand'),
                    differential: kind === 'dx' || definite ? 'x' : null
                };
                insertNode(node);
                caret = { sequenceId: definite ? node.lower.id : node.body.id, offset: 0 };
                finishChange();
            }

            function insertCombination(symbol) {
                recordHistory();
                const node = {
                    type: 'combination', symbol: symbol === 'P' ? 'P' : 'C',
                    left: sequence([], 'first argument'), right: sequence([], 'second argument')
                };
                insertNode(node);
                caret = { sequenceId: node.left.id, offset: 0 };
                finishChange();
            }

            function insertLargeOperator(operator) {
                recordHistory();
                const node = {
                    type: 'largeOperator', operator: operator === 'product' ? 'product' : 'sum',
                    lower: sequence([], 'lower bound'), upper: sequence([], 'upper bound'),
                    body: sequence([], 'operator expression')
                };
                insertNode(node);
                caret = { sequenceId: node.lower.id, offset: 0 };
                finishChange();
            }

            function insertScientificPower() {
                recordHistory();
                const model = currentSequence();
                insertNode(atom('×'), model, caret.offset);
                const exponent = sequence([], 'exponent');
                const node = { type: 'script', base: sequence([atom('10')], 'base'), superscript: exponent, subscript: null };
                insertNode(node, model, caret.offset);
                caret = { sequenceId: exponent.id, offset: 0 };
                finishChange();
            }

            function deepestSequence(node, first) {
                const slots = nestedSequences(node);
                if (!slots.length) return null;
                const slot = first ? slots[0] : slots[slots.length - 1];
                if (!slot.items.length) return slot;
                const child = first ? slot.items[0] : slot.items[slot.items.length - 1];
                return deepestSequence(child, first) || slot;
            }

            function collapseStructuredParent(parent) {
                const preservedItems = parent.slots.flatMap(slot => slot.items);
                recordHistory();
                parent.parentSequence.items.splice(parent.nodeIndex, 1, ...preservedItems);
                caret = {
                    sequenceId: parent.parentSequence.id,
                    offset: parent.nodeIndex + preservedItems.length
                };
                finishChange();
            }

            function backspace() {
                const model = currentSequence();
                if (caret.offset > 0) {
                    const previous = model.items[caret.offset - 1];
                    const nested = deepestSequence(previous, false);
                    if (nested) {
                        caret = { sequenceId: nested.id, offset: nested.items.length };
                        render();
                        emitState('caret');
                        return;
                    }
                    recordHistory();
                    model.items.splice(caret.offset - 1, 1);
                    caret.offset--;
                    finishChange();
                    return;
                }

                const parent = findParent(model.id);
                if (!parent) return;
                if (model.items.length === 0) {
                    collapseStructuredParent(parent);
                    return;
                }
                if (parent.slotIndex > 0) {
                    const previousSlot = parent.slots[parent.slotIndex - 1];
                    caret = { sequenceId: previousSlot.id, offset: previousSlot.items.length };
                    render();
                    emitState('caret');
                    return;
                }

                recordHistory();
                parent.parentSequence.items.splice(parent.nodeIndex, 1);
                caret = { sequenceId: parent.parentSequence.id, offset: parent.nodeIndex };
                finishChange();
            }

            function deleteForward() {
                const model = currentSequence();
                if (caret.offset < model.items.length) {
                    const next = model.items[caret.offset];
                    const nested = deepestSequence(next, true);
                    if (nested) {
                        caret = { sequenceId: nested.id, offset: 0 };
                        render();
                        emitState('caret');
                        return;
                    }
                    recordHistory();
                    model.items.splice(caret.offset, 1);
                    finishChange();
                    return;
                }
                moveHorizontal(1);
            }

            function clearDocument() {
                if (documentModel.root.items.length) recordHistory();
                documentModel = createDocument();
                caret = { sequenceId: documentModel.root.id, offset: 0 };
                render();
                emitState('cleared');
            }

            function moveHome() {
                selectAllActive = false;
                caret = { sequenceId: documentModel.root.id, offset: 0 };
                render();
                emitState('caret');
            }

            function moveEnd() {
                selectAllActive = false;
                caret = { sequenceId: documentModel.root.id, offset: documentModel.root.items.length };
                render();
                emitState('caret');
            }

            function undo() {
                if (!undoStack.length) return;
                redoStack.push(JSON.stringify({ documentModel, caret }));
                restoreSnapshot(undoStack.pop());
            }

            function redo() {
                if (!redoStack.length) return;
                undoStack.push(JSON.stringify({ documentModel, caret }));
                restoreSnapshot(redoStack.pop());
            }

            function finishChange(preserveSource = false) {
                if (!preserveSource) documentModel.sourceLatex = null;
                selectAllActive = false;
                render();
                emitState('change');
            }

            function insertLatex(value) {
                if (!value) return;

                const normalized = normalizeLatexForLoad(value);
                const parser = new LatexParser(normalized);
                const parsed = parser.parse();
                if (!parser.valid) {
                    emitState('rejected');
                    return;
                }

                const replacesWholeDocument = selectAllActive || documentModel.root.items.length === 0;
                recordHistory();
                deleteSelectionWithoutHistory();
                for (const node of parsed.items) {
                    if (node.type === 'lineBreak') appendTextWithoutHistory('\n');
                    else insertNode(node);
                }
                if (replacesWholeDocument) documentModel.sourceLatex = normalized;
                finishChange(replacesWholeDocument);
            }

            const latexSymbols = {
                '×': '\\times', '÷': '\\div', '≤': '\\le', '≥': '\\ge',
                '≠': '\\ne', '≈': '\\approx', '≡': '\\equiv', '±': '\\pm',
                '∪': '\\cup', '∩': '\\cap', 'π': '\\pi', '∞': '\\infty',
                'Δ': '\\Delta', 'Ω': '\\Omega', 'θ': '\\theta', 'α': '\\alpha',
                'β': '\\beta', 'γ': '\\gamma', 'δ': '\\delta', 'ε': '\\epsilon',
                'λ': '\\lambda', 'μ': '\\mu', 'ρ': '\\rho', 'σ': '\\sigma',
                'φ': '\\phi', 'ω': '\\omega', 'η': '\\eta', 'κ': '\\kappa',
                'τ': '\\tau', '∂': '\\partial', '∇': '\\nabla', '→': '\\to',
                '−': '-', '°': '\\circ'
            };

            function serializeSequence(model) {
                return model.items.map(serializeNode).join('');
            }

            function serializeDocument() {
                return typeof documentModel.sourceLatex === 'string'
                    ? documentModel.sourceLatex
                    : serializeSequence(documentModel.root);
            }

            function serializeNode(node) {
                switch (node.type) {
                    case 'atom':
                        return node.latex || latexSymbols[node.value] || node.value;
                    case 'lineBreak':
                        return '\n';
                    case 'fraction':
                        return `\\frac{${serializeSequence(node.numerator)}}{${serializeSequence(node.denominator)}}`;
                    case 'root':
                        return node.index
