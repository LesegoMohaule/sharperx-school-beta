                            ? `\\sqrt[${serializeSequence(node.index)}]{${serializeSequence(node.radicand)}}`
                            : node.braced === false
                                ? `\\sqrt${serializeSequence(node.radicand)}`
                                : `\\sqrt{${serializeSequence(node.radicand)}}`;
                    case 'script': {
                        let result = node.explicitEmptyBase ? '{}' : serializeSequence(node.base);
                        if (node.subscript) result += `_{${serializeSequence(node.subscript)}}`;
                        if (node.superscript) result += `^{${serializeSequence(node.superscript)}}`;
                        return result;
                    }
                    case 'function': {
                        let result = `\\${node.name}`;
                        if (node.power) result += `^{${serializeSequence(node.power)}}`;
                        return result + (node.argumentSeparator || '') + serializeSequence(node.argument);
                    }
                    case 'logarithm': {
                        let result = '\\log';
                        if (node.base) result += `_{${serializeSequence(node.base)}}`;
                        return result + (node.argumentSeparator || '') + serializeSequence(node.argument);
                    }
                    case 'factorial':
                        return `${serializeSequence(node.operand)}!`;
                    case 'delimiter':
                        return node.latexOpen
                            ? `${node.latexOpen}${serializeSequence(node.body)}${node.latexClose}`
                            : `${node.open}${serializeSequence(node.body)}${node.close}`;
                    case 'derivative': {
                        const numerator = serializeSequence(node.numerator);
                        const variable = serializeSequence(node.variable);
                        return node.order === 2
                            ? `\\frac{d^{2}${numerator}}{d${variable}^{2}}`
                            : `\\frac{d${numerator}}{d${variable}}`;
                    }
                    case 'limit':
                        return `\\lim_{${serializeSequence(node.variable)}\\to ${serializeSequence(node.destination)}${node.direction ? `^{${serializeSequence(node.direction)}}` : ''}}`;
                    case 'integral': {
                        let result = '\\int';
                        if (node.lower) result += `_{${serializeSequence(node.lower)}}`;
                        if (node.upper) result += `^{${serializeSequence(node.upper)}}`;
                        result += `{${serializeSequence(node.body)}}`;
                        if (node.differential) result += `\\,d${node.differential}`;
                        return result;
                    }
                    case 'combination':
                        return node.symbol === 'binom'
                            ? `\\binom{${serializeSequence(node.left)}}{${serializeSequence(node.right)}}`
                            : `${node.symbol}(${serializeSequence(node.left)},${serializeSequence(node.right)})`;
                    case 'largeOperator':
                        return `${node.operator === 'product' ? '\\prod' : '\\sum'}_{${serializeSequence(node.lower)}}^{${serializeSequence(node.upper)}}{${serializeSequence(node.body)}}`;
                    case 'environment':
                        return `\\begin{${node.name}}${serializeSequence(node.body).replace(/\n/g, '\\\\')}\\end{${node.name}}`;
                    default:
                        return '';
                }
            }

            function hasMeaningfulContent(model) {
                return model.items.some(node => {
                    if (node.type === 'atom') return /[A-Za-z0-9π∞ΔΩθα-ω∂∇]/u.test(node.value);
                    if (node.type === 'lineBreak') return false;
                    if (node.type === 'script') return hasMeaningfulContent(node.base);
                    if (node.type === 'factorial') return hasMeaningfulContent(node.operand);
                    if (node.type === 'limit') {
                        return hasMeaningfulContent(node.variable) || hasMeaningfulContent(node.destination);
                    }
                    return nestedSequences(node).some(hasMeaningfulContent);
                });
            }

            function describeSequence(model) {
                const parts = [];
                let textRun = '';
                const flushText = () => {
                    const normalized = textRun.replace(/\s+/g, ' ').trim();
                    if (normalized) parts.push(normalized);
                    textRun = '';
                };

                for (const node of model.items) {
                    if (node.type === 'atom' && !isOperator(node.value)) {
                        textRun += node.value;
                        continue;
                    }
                    flushText();
                    parts.push(describeNode(node));
                }
                flushText();
                const text = parts.join(' ').replace(/\s+/g, ' ').trim();
                return text || `empty ${model.role || 'maths'} slot`;
            }

            function describeNode(node) {
                switch (node.type) {
                    case 'atom': {
                        const spokenOperators = {
                            '−': 'minus', '-': 'minus', '+': 'plus', '×': 'times', '÷': 'divided by',
                            '=': 'equals', '<': 'less than', '>': 'greater than', '≤': 'less than or equal to',
                            '≥': 'greater than or equal to', '≠': 'not equal to', '≈': 'approximately',
                            '±': 'plus or minus', '→': 'approaches'
                        };
                        return spokenOperators[node.value] || node.value;
                    }
                    case 'lineBreak': return 'new line';
                    case 'fraction': return `fraction ${describeSequence(node.numerator)} over ${describeSequence(node.denominator)}`;
                    case 'root': return node.index
                        ? `${describeSequence(node.index)} root of ${describeSequence(node.radicand)}`
                        : `square root of ${describeSequence(node.radicand)}`;
                    case 'script': return `${describeSequence(node.base)}${node.superscript ? ` to the power ${describeSequence(node.superscript)}` : ''}${node.subscript ? ` subscript ${describeSequence(node.subscript)}` : ''}`;
                    case 'function': return `${node.name}${node.power ? ` to the power ${describeSequence(node.power)}` : ''} of ${describeSequence(node.argument)}`;
                    case 'logarithm': return node.base
                        ? `log base ${describeSequence(node.base)} of ${describeSequence(node.argument)}`
                        : `log of ${describeSequence(node.argument)}`;
                    case 'factorial': return `${describeSequence(node.operand)} factorial`;
                    case 'delimiter': return `${node.open} ${describeSequence(node.body)} ${node.close}`;
                    case 'derivative': return `${node.order === 2 ? 'second derivative' : 'derivative'}${hasMeaningfulContent(node.numerator) ? ` of ${describeSequence(node.numerator)}` : ''} with respect to ${describeSequence(node.variable)}`;
                    case 'limit': return `limit as ${describeSequence(node.variable)} approaches ${describeSequence(node.destination)}${node.direction ? ` from ${describeSequence(node.direction)}` : ''}`;
                    case 'integral': return `integral ${describeSequence(node.body)}`;
                    case 'combination': return `${node.symbol} of ${describeSequence(node.left)}, ${describeSequence(node.right)}`;
                    case 'largeOperator': return `${node.operator} ${describeSequence(node.body)}`;
                    case 'environment': return `${node.name} ${describeSequence(node.body)}`;
                    default: return '';
                }
            }

            function describeDocument() {
                return `Structured mathematics editor. ${describeSequence(documentModel.root)}. Caret in ${currentSequence().role || 'expression'}.`;
            }

            class LatexParser {
                constructor(source) {
                    this.source = String(source || '').replace(/\r\n?/g, '\n');
                    this.index = 0;
                    this.valid = true;
                }

                parse() {
                    return this.parseSequence(null, 'document');
                }

                parseSequence(stop, role = 'expression') {
                    const result = sequence([], role);
                    let closed = !stop;
                    while (this.index < this.source.length) {
                        const character = this.source[this.index];
                        if (stop && character === stop) {
                            this.index++;
                            closed = true;
                            break;
                        }
                        if (character === '\\') {
                            const node = this.parseCommand();
                            if (Array.isArray(node)) result.items.push(...node);
                            else if (node) result.items.push(node);
                            continue;
                        }
                        if (character === '$') {
                            // Accept legacy model output such as $x^2$ and
                            // $$x^2$$ without turning delimiters into atoms.
                            this.index++;
                            continue;
                        }
                        if (character === '^' || character === '_') {
                            this.index++;
                            this.attachScript(result, character === '^');
                            continue;
                        }
                        if (character === '(' || character === '[' || character === '{') {
                            const close = character === '(' ? ')' : character === '[' ? ']' : '}';
                            this.index++;
                            const body = this.parseSequence(close, 'delimited expression');
                            if (character === '{') result.items.push(...body.items);
                            else result.items.push({ type: 'delimiter', open: character, close, body });
                            continue;
                        }
                        if (character === '\n') {
                            this.index++;
                            result.items.push({ type: 'lineBreak' });
                            continue;
                        }
                        if ('²³'.includes(character)) {
                            this.index++;
                            this.attachFixedScript(result, character === '²' ? '2' : '3');
                            continue;
                        }
                        if (character === '!') {
                            this.index++;
                            let start = result.items.length;
                            while (start > 0 && !isExpressionBoundary(result.items[start - 1])) start--;
                            const operandItems = result.items.splice(start);
                            result.items.push({ type: 'factorial', operand: sequence(operandItems, 'factorial operand') });
                            continue;
                        }
                        this.index++;
                        result.items.push(atom(character === '-' ? '−' : character));
                    }
                    if (!closed) this.valid = false;
                    return result;
                }

                parseCommand() {
                    this.index++;
                    if (this.index >= this.source.length) return atom('');
                    if (!/[A-Za-z]/.test(this.source[this.index])) {
                        const escaped = this.source[this.index++];
                        if (escaped === ',') return atom(' ');
                        if (escaped === '$' || '()[]'.includes(escaped)) return null;
                        return atom(escaped);
                    }

                    const start = this.index;
                    while (this.index < this.source.length && /[A-Za-z]/.test(this.source[this.index])) this.index++;
                    const command = this.source.slice(start, this.index);

                    if (command === 'frac') {
                        const fraction = {
                            type: 'fraction',
                            numerator: this.parseRequiredGroup('numerator'),
                            denominator: this.parseRequiredGroup('denominator')
                        };
                        return this.asDerivative(fraction) || fraction;
                    }
                    if (command === 'sqrt') {
                        const index = this.peek() === '[' ? this.parseBracketGroup('root index') : null;
                        const braced = this.peek() === '{';
                        const radicand = braced
                            ? this.parseRequiredGroup('radicand')
                            : this.parseImplicitArgument('radicand').argument;
                        if (!radicand.items.length) this.valid = false;
                        return { type: 'root', index, radicand, braced };
                    }
                    if (command === 'log') {
                        const base = this.readScriptGroup('_', 'logarithm base');
                        const parsedArgument = this.parseImplicitArgument('logarithm argument');
                        return {
                            type: 'logarithm',
                            base,
                            argument: parsedArgument.argument,
                            argumentSeparator: parsedArgument.separator
                        };
                    }
                    if (['sin', 'cos', 'tan', 'csc', 'sec', 'cot', 'arcsin', 'arccos', 'arctan', 'ln'].includes(command)) {
                        const power = this.readScriptGroup('^', `${command} power`);
                        const parsedArgument = this.parseImplicitArgument(`${command} argument`);
                        return {
                            type: 'function',
                            name: command,
                            power,
                            argument: parsedArgument.argument,
                            argumentSeparator: parsedArgument.separator
                        };
                    }
                    if (command === 'lim') {
                        const target = this.readScriptGroup('_', 'limit target') || sequence([], 'limit target');
                        return this.splitLimitTarget(target);
                    }
                    if (command === 'int') {
                        const lower = this.readScriptGroup('_', 'lower bound');
                        const upper = this.readScriptGroup('^', 'upper bound');
                        while (this.peek() === ' ') this.index++;
                        let body = sequence([], 'integrand');
                        let differential = null;
                        const remaining = this.source.slice(this.index);
                        const differentialMatch = /\\,\s*d([A-Za-z])/.exec(remaining);
                        if (differentialMatch) {
                            const bodySource = remaining.slice(0, differentialMatch.index);
                            const bodyParser = new LatexParser(bodySource);
                            body = bodyParser.parse();
                            if (!bodyParser.valid) this.valid = false;
                            this.index += differentialMatch.index + differentialMatch[0].length;
                            differential = differentialMatch[1];
                        } else {
                            body = this.peek() === '{'
                                ? this.parseRequiredGroup('integrand')
                                : this.parseImplicitArgument('integrand').argument;
                        }
                        return { type: 'integral', lower, upper, body, differential };
                    }
                    if (command === 'sum' || command === 'prod') {
                        const node = {
                            type: 'largeOperator', operator: command === 'prod' ? 'product' : 'sum',
                            lower: this.readScriptGroup('_', 'lower bound') || sequence([], 'lower bound'),
                            upper: this.readScriptGroup('^', 'upper bound') || sequence([], 'upper bound'),
                            body: sequence([], 'operator expression')
                        };
                        while (this.peek() === ' ') this.index++;
                        node.body = this.peek() === '{'
                            ? this.parseRequiredGroup('operator expression')
                            : this.parseImplicitArgument('operator expression').argument;
                        return node;
                    }
                    if (command === 'binom') {
                        return {
                            type: 'combination',
                            symbol: 'binom',
                            left: this.parseRequiredGroup('first argument'),
                            right: this.parseRequiredGroup('second argument')
                        };
                    }
                    if (command === 'pmod') {
                        const modulus = this.parseRequiredGroup('modulus');
                        return atom(`mod ${serializeSequence(modulus)}`, `\\pmod{${serializeSequence(modulus)}}`);
                    }
                    if ([
                        'text', 'textbf', 'textit', 'textnormal', 'textrm', 'textsf', 'texttt',
                        'emph', 'mathbf', 'mathit', 'mathrm', 'mathsf', 'mathtt', 'underline',
                        'overline', 'boxed', 'boldsymbol', 'bm', 'pmb', 'operatorname'
                    ].includes(command)) {
                        return this.parseRequiredGroup('text wrapper').items;
                    }
                    if (command === 'textcolor' || command === 'color') {
                        this.parseRequiredGroup('text colour');
                        return this.parseRequiredGroup('coloured text').items;
                    }
                    if (command === 'begin') {
                        const name = this.readRawRequiredGroup();
                        const endToken = `\\end{${name}}`;
                        const endIndex = name ? this.source.indexOf(endToken, this.index) : -1;
                        if (endIndex < 0) {
                            this.valid = false;
                            return null;
                        }
                        const bodySource = this.source.slice(this.index, endIndex);
                        this.index = endIndex + endToken.length;
                        const rows = bodySource.split(/\\\\/);
                        const body = sequence([], `${name} rows`);
                        rows.forEach((row, rowIndex) => {
                            const rowParser = new LatexParser(row);
                            const parsedRow = rowParser.parse();
                            if (!rowParser.valid) this.valid = false;
                            body.items.push(...parsedRow.items);
                            if (rowIndex < rows.length - 1) body.items.push({ type: 'lineBreak' });
                        });
                        return { type: 'environment', name, body };
                    }
                    if (command === 'end') {
                        this.valid = false;
                        return null;
                    }
                    if (command === 'left') return this.parseLeftRightDelimiter();

                    return;
                }
                if (!physicalKeyboardEnabled) return;
                if (event.isComposing) return;

                const modifier = event.ctrlKey || event.metaKey;
                if (modifier) {
                    const lower = key.toLowerCase();
                    if (['c', 'x', 'v'].includes(lower)) {
                        event.preventDefault();
                        event.stopPropagation();
                        requestClipboardAction({ c: 'copy', x: 'cut', v: 'paste' }[lower]);
                    } else if (lower === 'a') {
                        event.preventDefault();
                        event.stopPropagation();
                        executePhysicalCommand({ name: 'selectAll' });
                    } else if (lower === 'z') {
                        event.preventDefault();
                        event.stopPropagation();
                        executePhysicalCommand({ name: event.shiftKey ? 'redo' : 'undo' });
                    } else if (lower === 'y') {
                        event.preventDefault();
                        event.stopPropagation();
                        executePhysicalCommand({ name: 'redo' });
                    }
                    return;
                }

                const commands = {
                    Backspace: 'backspace',
                    Delete: 'delete',
                    ArrowLeft: 'moveLeft',
                    ArrowRight: 'moveRight',
                    ArrowUp: 'moveUp',
                    ArrowDown: 'moveDown',
                    Home: 'moveHome',
                    End: 'moveEnd',
                    Enter: 'newLine',
                    Return: 'newLine',
                    Tab: event.shiftKey ? 'moveLeft' : 'moveRight'
                };
                const commandName = commands[key];
                const command = commandName
                    ? { name: commandName }
                    : key.length === 1 && key !== '\u0000'
                        ? { name: 'insertText', value: key }
                        : null;
                if (!command) return;

                event.preventDefault();
                event.stopPropagation();
                executePhysicalCommand(command);
            }

            function handleNativeLineBreakInput(event) {
                if (!editor.contains(event.target)) return;

                const inputType = String(event.inputType || '');
                const isLineBreakInput = inputType === 'insertParagraph' ||
                    inputType === 'insertLineBreak' ||
                    String(event.data || '') === '\n' ||
                    String(event.data || '') === '\r';
                if (!isLineBreakInput) return;

                // WebView2 can bypass keydown for contenteditable Enter and
                // send beforeinput directly. Stop Chromium's native paragraph
                // insertion and feed the same guarded command model instead.
                event.preventDefault();
                event.stopPropagation();
                executePhysicalCommand({ name: 'newLine' });
            }

            // Enter is handled by the structured editor command model so it
            // cannot fall through to a WinUI default-button/window accelerator
            // when the WebView is focused.
            document.addEventListener('beforeinput', handleNativeLineBreakInput, true);
            editor.addEventListener('keydown', handlePhysicalKeyDown);

            const caretRelativeCommandNames = new Set([
                'insertText', 'insertLatex', 'insertFraction', 'insertRoot',
                'insertNthRoot', 'insertPower', 'insertFixedPower',
                'insertSubscript', 'insertAbsolute', 'insertDelimiter',
                'insertFunction', 'insertLogarithm', 'insertFactorial',
                'insertInfinity', 'insertDerivative', 'insertLimit',
                'insertIntegral', 'insertCombination', 'insertLargeOperator',
                'insertScientificPower', 'backspace', 'delete', 'newLine',
                'moveLeft', 'moveRight', 'moveUp', 'moveDown'
            ]);

            const explicitCaretResetCommandNames = new Set([
                'clear', 'moveHome', 'moveEnd', 'selectAll', 'undo', 'redo'
            ]);

            function prepareCaretForCommand(command) {
                const commandName = String(command?.name || '');
                if (caretRelativeCommandNames.has(commandName) && pendingPhysicalTapCaret) {
                    const pending = pendingPhysicalTapCaret;
                    pendingPhysicalTapCaret = null;
                    const model = findSequence(pending.sequenceId);
                    if (model) {
                        selectAllActive = false;
                        caret = {
                            sequenceId: model.id,
                            offset: clamp(Number(pending.offset) || 0, 0, model.items.length)
                        };
                    }
                    return;
                }

                if (explicitCaretResetCommandNames.has(commandName)) {
                    pendingPhysicalTapCaret = null;
                    return;
                }

                if (commandName === 'loadLatex' &&
                    String(command?.value || '') !== serializeDocument()) {
                    pendingPhysicalTapCaret = null;
                }
            }

            function selectedModelRange() {
                if (selectAllActive)
                    return { model: documentModel.root, start: 0, end: documentModel.root.items.length };
                const selection = window.getSelection();
                if (!selection || !selection.rangeCount || selection.isCollapsed) return null;
                const range = selection.getRangeAt(0);
                if (!editor.contains(range.commonAncestorContainer)) return null;
                const ancestor = range.commonAncestorContainer.nodeType === 1
                    ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
                const sequenceElement = ancestor.closest('.math-sequence') || editor.querySelector('.math-document');
                if (!sequenceElement) return null;
                const model = findSequence(sequenceElement.dataset.sequenceId);
                if (!model) return null;
                const from = range.cloneRange(), to = range.cloneRange();
                from.collapse(true);
                to.collapse(false);
                const indices = Array.from(sequenceElement.children)
                    .filter(child => child.classList.contains('math-item'))
                    .filter(child => {
                        const span = document.createRange();
                        span.selectNodeContents(child);
                        const left = span.cloneRange(), right = span.cloneRange();
                        left.collapse(true);
                        right.collapse(false);
                        return to.compareBoundaryPoints(0, left) > 0 && from.compareBoundaryPoints(0, right) < 0;
                    })
                    .map(child => Number(child.dataset.itemIndex));
                return indices.length ? { model, start: Math.min(...indices), end: Math.max(...indices) + 1 } : null;
            }

            function getClipboardText(scope = 'selection') {
                if (scope === 'all') return serializeDocument();
                const range = scope === 'line' ? currentLineRange() : selectedModelRange();
                return range ? serializeSequence({ items: range.model.items.slice(range.start, range.end) }) : '';
            }

            function getClipboardPayload(scope = 'selection') {
                const range = selectedModelRange();
                return JSON.stringify({
                    text: getClipboardText(scope),
                    document: serializeDocument(),
                    sequenceId: range?.model.id,
                    start: range?.start,
                    end: range?.end
                });
            }

            function deleteSelectionWithoutHistory(range = selectedModelRange()) {
                if (!range) return;
                range.model.items.splice(range.start, range.end - range.start);
                caret = { sequenceId: range.model.id, offset: range.start };
                selectAllActive = false;
                pendingPhysicalTapCaret = null;
                window.getSelection()?.removeAllRanges();
            }

            function deleteClipboardSelection(payload) {
                const saved = JSON.parse(payload || '{}');
                // Do not cut newer edits if the OS clipboard write finished late.
                if (saved.document !== serializeDocument()) return;
                const model = findSequence(saved.sequenceId);
                if (!model || !Number.isInteger(saved.start) || !Number.isInteger(saved.end) ||
                    saved.start < 0 || saved.end <= saved.start || saved.end > model.items.length) return;
                recordHistory();
                deleteSelectionWithoutHistory({ model, start: saved.start, end: saved.end });
                finishChange();
            }

            let clipboardMenu = null;
            function hideClipboardMenu() {
                clipboardMenu?.remove();
                clipboardMenu = null;
            }

            function requestClipboardAction(action) {
                pendingPhysicalTapCaret = null;
                hideClipboardMenu();
                // Native clipboard access works for local WebViews without
                // browser permission prompts. The host reads semantic LaTeX.
                emitState('clipboard-' + action);
            }

            function showClipboardMenu(event) {
                event.preventDefault();
                if (!physicalKeyboardEnabled) return;
                hideClipboardMenu();
                if (!selectedModelRange()) placeCaretFromPointer(event);
                pendingPhysicalTapCaret = null;
                clipboardMenu = document.createElement('div');
                clipboardMenu.setAttribute('role', 'toolbar');
                clipboardMenu.setAttribute('aria-label', 'Text clipboard');
                clipboardMenu.style.cssText = 'position:fixed;z-index:10000;display:flex;gap:2px;padding:5px;background:white;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 3px 12px #0003;';
                clipboardMenu.addEventListener('pointerdown', e => e.preventDefault());
                for (const [label, action] of [['Cut', 'cut'], ['Copy', 'copy'], ['Paste', 'paste'], ['Select all', 'selectAll']]) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = label;
                    button.style.cssText = 'font:14px system-ui;padding:7px 9px;border:0;border-radius:4px;background:#f1f5f9;color:#0f172a;cursor:pointer;';
                    button.addEventListener('click', () => {
                        if (action === 'selectAll') { hideClipboardMenu(); selectAll(); }
                        else requestClipboardAction(action);
                    });
                    clipboardMenu.appendChild(button);
                }
                document.body.appendChild(clipboardMenu);
                const bounds = clipboardMenu.getBoundingClientRect();
                clipboardMenu.style.left = Math.max(0, Math.min(event.clientX, window.innerWidth - bounds.width - 4)) + 'px';
                clipboardMenu.style.top = Math.max(0, Math.min(event.clientY, window.innerHeight - bounds.height - 4)) + 'px';
            }

            document.addEventListener('pointerdown', event => {
                if (clipboardMenu && !clipboardMenu.contains(event.target)) hideClipboardMenu();
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') hideClipboardMenu();
            });
            // Also intercept native clipboard events (e.g. accessibility and
            // WebView menu commands), so Chromium never flattens a fraction.
            for (const action of ['copy', 'cut', 'paste']) {
                editor.addEventListener(action, event => {
                    event.preventDefault();
                    requestClipboardAction(action);
                });
            }

            function decodeCommandPayload(encodedPayload) {
                const binary = atob(String(encodedPayload || ''));
                const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
                return JSON.parse(new TextDecoder().decode(bytes));
            }

            window.SharperMathEditor = {
                getClipboardText,
                getClipboardPayload,
                getLatex() {
                    // Send actions can arrive in the same event turn as the
                    // last keyboard command. Expose the model's authoritative
                    // serialized document so the native shell can fetch the
                    // complete visible expression instead of relying on the
                    // last asynchronous state URL.
                    return serializeDocument();
                },
                placeCaretAtPoint,
                placeCaretAtNativePoint,
                scrollBy,
                setPhysicalKeyboardEnabled(enabled) {
                    physicalKeyboardEnabled = enabled === true || String(enabled).toLowerCase() === 'true';
                },
                focusForPhysicalKeyboard() {
                    keepEditorFocused();
                },
                executeEncoded(encodedPayload) {
                    window.SharperMathEditor.execute(decodeCommandPayload(encodedPayload));
                },
                execute(command) {
                    lastCommandDebug = String(command?.name || 'none');
                    if (!command || !command.name) return emitState('noop');
                    // Physical keys and DOM-only actions have no host sequence.
                    // Preserve the last applied host command so subsequent
                    // changes/activations are not rejected by MAUI's clear and
                    // external-load guards as stale (sequence zero).
                    const commandSequence = Number(command.sequence);
                    if (command.sequence != null &&
                        Number.isFinite(commandSequence) && commandSequence >= 0) {
                        activeCommandSequence = commandSequence;
                    }
                    prepareCaretForCommand(command);
                    // Do not refocus the DOM editor for custom-keyboard input.
                    // The structured caret is model state and remains valid
                    // while the cell is blurred. Only a physical cell touch or
                    // the explicit focus command should focus the editor.
                    switch (command.name) {
                        case 'loadLatex': loadLatex(command.value || ''); break;
                        case 'setPhysicalKeyboardEnabled':
                            physicalKeyboardEnabled = String(command.value).toLowerCase() === 'true';
                            emitState('layout');
                            break;
                        case 'setPlaceholder': placeholderText = command.value || ''; render(); emitState('layout'); break;
                        case 'setLineLabels':
                            showLineLabels = String(command.value).toLowerCase() === 'true';
                            editorShell.classList.toggle('line-labels-visible', showLineLabels);
                            render();
                            emitState('layout');
                            break;
                        case 'setFontSize': setFontSize(command.value); break;
                        case 'setAutomationId': editor.id = String(command.value || 'StructuredMathEditor').replace(/[^A-Za-z0-9_.-]/g, '_'); emitState('layout'); break;
                        case 'focus': keepEditorFocused(); render(); emitState('activate'); break;
                        case 'insertText': insertText(command.value || ''); break;
                        // Bracket keys are deliberately a one-character
                        // operation. They never create a delimiter node or
                        // an empty body; the learner supplies both sides.
                        case 'insertLiteralBracket':
                            if (['(', '[', '{'].includes(String(command.value || ''))) {
                                recordHistory();
                                insertNode(atom(String(command.value)));
                                finishChange();
                            }
                            break;
                        case 'insertLatex': insertLatex(command.value || ''); break;
                        case 'insertFraction': insertFraction(); break;
                        case 'insertRoot': insertRoot(false); break;
                        case 'insertNthRoot': insertRoot(true); break;
                        case 'insertPower': insertPower(); break;
                        case 'insertFixedPower': insertPower(command.value || '2'); break;
                        case 'insertSubscript': insertSubscript(); break;
                        case 'insertAbsolute': insertDelimiter('||'); break;
                        case 'insertDelimiter': insertDelimiter(command.value || '()'); break;
                        case 'insertFunction': insertFunction(command.value); break;
                        case 'insertLogarithm': insertLogarithm(); break;
                        case 'insertFactorial': insertFactorial(); break;
                        case 'insertInfinity': insertInfinity(); break;
                        case 'insertDerivative': insertDerivative(command.value); break;
                        case 'insertLimit': insertLimit(command.value); break;
                        case 'insertIntegral': insertIntegral(command.value); break;
                        case 'insertCombination': insertCombination(command.value); break;
                        case 'insertLargeOperator': insertLargeOperator(command.value); break;
                        case 'insertScientificPower': insertScientificPower(); break;
                        case 'backspace': backspace(); break;
                        case 'delete': deleteForward(); break;
                        case 'newLine': insertText('\n'); break;
                        case 'moveLeft': moveHorizontal(-1); break;
                        case 'moveRight': moveHorizontal(1); break;
                        case 'moveUp': moveVertical(-1); break;
                        case 'moveDown': moveVertical(1); break;
                        case 'moveHome': moveHome(); break;
                        case 'moveEnd': moveEnd(); break;
                        case 'undo': undo(); break;
                        case 'redo': redo(); break;
                        case 'selectAll': selectAll(); break;
                        case 'deleteClipboardSelection': deleteClipboardSelection(command.value); break;
                        case 'clear': clearDocument(); break;
                        case 'getState': return emitState('state');
                        default: return emitState('noop');
                    }
                    return null;
                }
            };

            if (typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(refitAfterResize);
                resizeObserver.observe(editor);
                window.__sharperMathResizeObserver = resizeObserver;
            } else {
                window.addEventListener('resize', refitAfterResize);
            }

            render();
            setTimeout(() => emitState('ready'), 0);
        })();
    </script>
</body>
</html>
