<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SharperX School Beta Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #f7fbff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(55, 189, 248, 0.2), transparent 32rem),
        linear-gradient(135deg, #07111f 0%, #0e1b31 52%, #07111f 100%);
    }

    main {
      width: min(640px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    p:first-child {
      display: inline-flex;
      margin: 0 0 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #bae6fd;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 0.95;
    }

    p:last-child {
      margin: 22px auto 0;
      max-width: 36rem;
      color: #d8e7f5;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p>Beta offline</p>
    <h1>SharperX School Beta is currently offline.</h1>
    <p>This beta page has been taken down. Please check back later or contact the SharperTime team for access.</p>
  </main>
</body>
</html>
